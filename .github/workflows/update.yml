name: Atualizar playlists
on:
  schedule:
    - cron: "17 6 * * 1"   # toda segunda, 03:17 (Brasília)
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python scripts/build.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "chore: atualização automática das playlists ($(date -u +%Y-%m-%d))"
          git push
