# /etc/nginx/sites-available/uandtv — serve o stream HLS
server {
    listen 80 default_server;
    server_name _;
    root /var/www/uandtv;

    location / {
        add_header Access-Control-Allow-Origin * always;
        add_header Cache-Control "no-cache" always;
        types {
            application/vnd.apple.mpegurl m3u8;
            video/mp2t ts;
        }
    }
    # a playlist nunca pode ficar em cache; os pedaços podem por 1 min
    location ~ \.m3u8$ { add_header Cache-Control "no-store" always; add_header Access-Control-Allow-Origin * always; }
    location ~ \.ts$   { add_header Cache-Control "max-age=60" always; add_header Access-Control-Allow-Origin * always; }
}
